name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18

      - name: Install the ADLC toolkit
        # A handful of tests exercise the real adlc CLI directly (e.g. a
        # live `adlc coldstart` smoke check, mechanical rails-guard wiring)
        # rather than the fake-adlc fixture — same pinned version as
        # adlc-rails-guard.yml.
        run: npm install -g --ignore-scripts @adlc/cli@1.1.0

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
