name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Gate sandboxing is supported on macOS (sandbox-exec) and Linux (bubblewrap).
    # We test on both platforms to ensure the sandbox boundary — which stops an
    # untrusted worktree script from reaching the host — is fully exercised.
    # Node 18 is the engines floor, 20 is what publish.yml runs, 22 is current.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Bubblewrap (Linux Sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install the ADLC toolkit
        # A handful of tests exercise the real adlc CLI directly (e.g. a
        # live `adlc coldstart` smoke check, mechanical rails-guard wiring)
        # rather than the fake-adlc fixture — same pinned version as
        # adlc-rails-guard.yml.
        run: npm install -g --ignore-scripts @adlc/cli@1.1.0

      - name: Install dependencies
        # ci, not install: fail on a lockfile that has drifted from
        # package.json rather than silently resolving something else.
        run: npm ci

      - name: Run tests
        run: npm test

  coverage:
    # Thresholds are a ratchet against regression, not a target: they sit just
    # under the current numbers. Raise them when coverage improves; do not lower
    # them to make a red build green. Node 22 only — --test-coverage-* landed
    # there, so this cannot run on the Node 18 floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the ADLC toolkit
        run: npm install -g --ignore-scripts @adlc/cli@1.1.0

      - name: Install dependencies
        run: npm ci

      - name: Check coverage
        run: npm run coverage:check
