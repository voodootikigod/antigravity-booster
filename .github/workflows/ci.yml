name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Gate sandboxing is supported on macOS (sandbox-exec) and Linux (bubblewrap).
    # We test on both platforms to ensure the sandbox boundary — which stops an
    # untrusted worktree script from reaching the host — is fully exercised.
    # Node 18 is the engines floor, 20 is what publish.yml runs, 22 is current.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Node >= 22.19.0 is required.
        node-version: [22.x]
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history: test/rails-guard-ci.test.mjs replays real archive PRs
          # (#82/#83/#86) through the guard; it skips on a shallow clone.
          fetch-depth: 0

      - name: Install Bubblewrap (Linux Sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Verify Bubblewrap Userns
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-net -- true || echo "bwrap still restricted, tests may skip or fallback"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install the ADLC toolkit
        # A handful of tests exercise the real adlc CLI directly (e.g. a
        # live `adlc coldstart` smoke check, mechanical rails-guard wiring)
        # rather than the fake-adlc fixture — same pinned version as
        # adlc-rails-guard.yml.
        run: npm install -g --ignore-scripts @adlc/cli@1.11.1

      - name: Install dependencies
        # ci, not install: fail on a lockfile that has drifted from
        # package.json rather than silently resolving something else.
        run: npm ci

      - name: Run tests
        run: npm test

  coverage:
    # Thresholds are a ratchet against regression, not a target: they sit just
    # under the current numbers. Raise them when coverage improves; do not lower
    # them to make a red build green. Node 22 only — --test-coverage-* landed
    # there, so this cannot run on the Node 18 floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Bubblewrap (Linux Sandbox)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Verify Bubblewrap Userns
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-net -- true || echo "bwrap still restricted, tests may skip or fallback"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the ADLC toolkit
        run: npm install -g --ignore-scripts @adlc/cli@1.11.1

      - name: Install dependencies
        run: npm ci

      - name: Check coverage
        run: npm run coverage:check

  plugin-integrity:
    # Native agy plugin distribution guards (spec .adlc/specs/native-plugin-
    # installation.md §4.1, Appendix A D6/P3). One canonical job: bundle bytes
    # are compared here only, so a matrix leg can never flap the drift gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: npm ci

      - name: Bundle drift gate (dist/ and vendor/ must match a fresh build)
        run: |
          npm run build
          STATUS="$(git status --porcelain --untracked-files=all dist/ vendor/)"
          if [ -n "$STATUS" ]; then
            echo "error: committed dist/ or vendor/ is stale or has untracked files:" >&2
            echo "$STATUS" >&2
            exit 1
          fi

      - name: Shellcheck POSIX launchers
        run: shellcheck -s sh bin/node-launcher.sh bin/hook-runner.sh

      - name: Vendored @adlc/antigravity tarball is byte-identical to the npm release
        run: |
          VERSION="$(node -p "require('./package.json').devDependencies['@adlc/antigravity']")"
          VENDORED="vendor/cache/adlc-antigravity-${VERSION}.tgz"
          test -f "$VENDORED" || { echo "error: missing $VENDORED" >&2; exit 1; }
          npm pack "@adlc/antigravity@${VERSION}" --pack-destination "$RUNNER_TEMP" >/dev/null
          cmp "$VENDORED" "$RUNNER_TEMP/adlc-antigravity-${VERSION}.tgz"
