# Docs site verification (spec .adlc/specs/docs-site.md section 8).
# Verifies only: it never deploys. Vercel's GitHub integration deploys
# production from main and a preview per PR (section 8.1).
name: Docs

on:
  pull_request:
    paths:
      - "lib/**"
      - "bin/**"
      - "mcp/**"
      - "hooks/**"
      - "sidecars/**"
      - "scripts/**"
      - "commands/**"
      - "agents/**"
      - "skills/**"
      - "templates/**"
      - "dist/**"
      - "vendor/**"
      - "plugin.json"
      - "hooks.json"
      - "mcp_config.json"
      - "package.json"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "bin/**"
      - "mcp/**"
      - "hooks/**"
      - "sidecars/**"
      - "scripts/**"
      - "commands/**"
      - "agents/**"
      - "skills/**"
      - "templates/**"
      - "dist/**"
      - "vendor/**"
      - "plugin.json"
      - "hooks.json"
      - "mcp_config.json"
      - "package.json"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs.yml"

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Classify changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Fail open: on push, an all-zero base, or any diff error, run every job.
          if [ "$EVENT" = "push" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "docs=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "docs=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false; docs=false
          if printf '%s\n' "$files" | grep -qE '^(lib|bin|mcp|hooks|sidecars|scripts|commands|agents|skills|templates|dist|vendor|website)/|^(plugin\.json|hooks\.json|mcp_config\.json|package\.json|CONTRIBUTING\.md|CHANGELOG\.md)$|^\.github/workflows/docs\.yml$'; then code=true; fi
          if printf '%s\n' "$files" | grep -qE '^(website|docs)/|^[^/]+\.md$|^\.github/workflows/docs\.yml$'; then docs=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "code=$code docs=$docs"

  gen-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
      - name: Generated reference is up to date
        run: node website/scripts/gen-reference.mjs --check
      - name: Docs checks (IA, schema drift, stale claims, evidence, known issues)
        run: node website/scripts/check-all.mjs
      - name: Check-script tests
        run: node --test website/scripts/test/

  build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint:links
      - run: npm run check:site
      - run: node scripts/check-ia.mjs
